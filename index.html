<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - K.Ramakrishnan College of Technology</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Ramakrishna College of Technology – Faculty Availability System</h1>
    </header>

    <main>
        <div class="login-container">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="role">Login as:</label>
                    <select id="role">
                        <option value="student">Student</option>
                        <option value="faculty">Faculty</option>
                    </select>
                </div>
                <button type="submit">Login</button>
            </form>
            <p id="error-message" class="error-message"></p>
        </div>
    </main>

    <footer>
        <p>Developed by [Your Startup Name] | Ramakrishna College of Technology</p>
    </footer>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>

    <script>
      // Redirect students to student-dashboard.html and faculty to faculty-dashboard.html
      document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('error-message');

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          errorEl.textContent = '';

          const email = document.getElementById('email').value.trim();
          const pass = document.getElementById('password').value.trim();
          const role = (document.getElementById('role').value || '').trim();

          if (!email || !pass) {
            errorEl.textContent = 'Please enter email and password.';
            return;
          }

          // Minimal session for demo (replace with real auth in production)
          const displayName = email.split('@')[0].replace(/[._]/g, ' ');
          sessionStorage.setItem('loggedIn', 'true');
          sessionStorage.setItem('role', role);
          sessionStorage.setItem('email', email);
          sessionStorage.setItem('name', displayName);

          if (role === 'faculty') {
            // Exact filename in your folder
            window.location.href = 'faculty-dashboard.html';
          } else {
            // Redirect students to student-dashboard.html (exact filename)
            window.location.href = 'student-dashboard.html';
          }
        });
      });
    </script>
  </body>
</html>
